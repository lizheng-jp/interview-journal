name: interview-journal
services:
  web:
    build:
      context: ./frontend
      args:
        INTERNAL_API_URL: http://api:8000
    restart: unless-stopped
    ports:
      # Loopback only; NOT public. Confirm 13080 is unused before starting.
      - '127.0.0.1:${INTERVIEW_LOCAL_PORT:-13080}:3000'
    depends_on:
      api:
        condition: service_healthy
    networks: [interview_private]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 512m
    cpus: 0.6

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/interview.db}
      STORAGE_DIR: /data/audio
      OWNER_ID: ${OWNER_ID:-local-owner}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      APP_ORIGINS: ${APP_ORIGINS:-http://localhost:13080,http://127.0.0.1:13080}
    volumes:
      - interview_data:/data
    networks: [interview_private]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: 0.5

  transcription:
    profiles: [transcription]
    build:
      context: ./backend
      args:
        WITH_TRANSCRIPTION: 'true'
    restart: unless-stopped
    command: python -m app.worker
    depends_on:
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/interview.db}
      STORAGE_DIR: /data/audio
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      WHISPER_CPU_THREADS: '1'
      HF_HOME: /data/model_cache
    volumes:
      - interview_data:/data
    networks: [interview_private]
    mem_limit: 1536m
    cpus: 1.0

networks:
  interview_private:
    internal: false

volumes:
  interview_data:
    name: interview_journal_data
