name: MVP checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  local-mvp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements-dev.txt
      - run: PYTHONPATH=backend python -m pytest backend/tests -q
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - name: Generate ephemeral local-only credentials
        run: |
          python - <<'PY'
          import secrets
          from pathlib import Path
          p = Path('.env')
          p.write_text('LOCAL_POSTGRES_PASSWORD='+secrets.token_hex(24)+'\n')
          p.chmod(0o600)
          PY
      - name: Build and start isolated PostgreSQL application
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build --wait db api web
      - run: python scripts/test_postgres.py
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
      - name: Stop only the isolated CI application
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml down
